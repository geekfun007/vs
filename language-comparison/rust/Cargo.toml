[package]
name = "rust-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.11"
thiserror = "2.0"
axum = "0.7"
futures = "0.3"

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "http_server"
path = "src/http_server.rs"

[[bin]]
name = "http_client"
path = "src/http_client.rs"
